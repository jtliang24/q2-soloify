[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soloify"
version = "0.0.1"
description = "Bridge between Spotify Soloist and Q2 Pod's Soloify relay"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=41",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
soloify = "soloify.cli:main"

[tool.setuptools.packages.find]
where = ["bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["bridge", "tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["bridge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
