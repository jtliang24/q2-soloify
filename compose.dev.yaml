# Development: the repo's git-ignored soloist_release_<target>.tar.gz is installed instead of a
# download, and the container idles instead of running the bridge, for `docker compose exec soloify
# sh` to run Soloist or soloify serve by hand.
services:
  soloify:
    volumes:
      - ./:/import:ro
    command: ["sleep", "infinity"]
    restart: "no"
