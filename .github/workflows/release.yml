name: Publish matching Soloify artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag containing the maintainer-built card ZIP
        required: true
      purpose:
        description: Walkthrough prerelease or validated release
        type: choice
        options:
          - walkthrough
          - validated
        default: walkthrough
        required: true
      walkthroughs_verified:
        description: Required physical-host walkthroughs are recorded and passed (validated releases only)
        type: boolean
        default: false
        required: true
permissions:
  contents: write
  packages: write
jobs:
  release:
    if: inputs.purpose == 'walkthrough' || inputs.walkthroughs_verified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build '.[test]'
      - run: python -m pytest -q tests/test_cli.py tests/test_soloist.py tests/test_setup.py tests/test_release.py tests/test_spotify.py
      - name: Validate release version and download maintainer card package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(python -c 'from soloify import __version__; print(__version__)')
          test "$RELEASE_TAG" = "v$VERSION"
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -x true
          mkdir -p build/maintainer
          gh release download "$RELEASE_TAG" --pattern "soloify-card-$VERSION.zip" --dir build/maintainer
          python -m build --wheel --outdir build/wheel
          python tools/release.py --wheel "build/wheel/soloify-$VERSION-py3-none-any.whl" --card "build/maintainer/soloify-card-$VERSION.zip"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag
        id: image
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "tag=ghcr.io/jtliang24/q2-soloify:${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Containerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.image.outputs.tag }}
      - name: Verify anonymous image pull
        env:
          RELEASE_IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/soloify-anonymous"
          docker --config "$RUNNER_TEMP/soloify-anonymous" pull --platform linux/amd64 "$RELEASE_IMAGE"
      - name: Upload and publish artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PURPOSE: ${{ inputs.purpose }}
        run: |
          gh release upload "$RELEASE_TAG" build/release/* --clobber
          gh release view "$RELEASE_TAG" --json assets > build/release-assets.json
          python -c 'import json; from pathlib import Path; expected={p.name for p in Path("build/release").iterdir()}; actual={a["name"] for a in json.loads(Path("build/release-assets.json").read_text())["assets"]}; assert actual == expected, "Draft contains unexpected release assets"'
          if [ "$RELEASE_PURPOSE" = walkthrough ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
